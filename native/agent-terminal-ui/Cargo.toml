[package]
name = "agent-terminal-ui-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "Tuig native Ratatui terminal interface for Arbora"
license = "MIT"
repository = "https://github.com/Knuckles-Team/tuig"

[[bin]]
name = "tuig"
path = "src/main.rs"

[dependencies]
# Level-triggered input keeps keys queued alongside resize readable (crossterm#1126).
# The 0.28 event-stream backend also needs libc with use-dev-tty (crossterm#935).
crossterm = { version = "0.29", features = ["event-stream", "use-dev-tty", "libc"] }
futures-util = "0.3"
getrandom = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "process", "signal", "sync"] }
time = { version = "0.3", features = ["parsing"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["fs"] }
