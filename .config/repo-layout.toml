# Every tracked root entry has an explicit purpose.

[dirs]
".config" = "Shared gate declarations and documentation theme overrides."
".github" = "GitHub Actions workflows and dashboard source configuration."
".security" = "Security scanning configuration and reviewed policy inputs."
".specify" = "Project constitution; no feature or generated source belongs here."
"docs" = "Published documentation content."
"native" = "Native terminal implementation and build inputs."
"plans" = "Historical source evidence and complete spec migration path map."
"scripts" = "Repository validation and maintenance commands."
"specs" = "Canonical requirements, plans, tasks, test contracts and generated status."
"tests" = "Automated regression and acceptance tests."

[files]
"LICENSE" = "Project MIT license."
"AGENTS.md" = "Repository contributor instructions."
"CHANGELOG.md" = "Release history."
"CONTRIBUTING.md" = "Contributor setup, validation commands and source map."
"CLAUDE.md" = "Claude instruction entry point."
"README.md" = "Public installation and project entry point."
"mkdocs.yml" = "Published documentation navigation and build configuration."
"opencode.json" = "Terminal client integration configuration."
"pyproject.toml" = "Python package metadata and tool configuration."
"pytest.ini" = "Pytest discovery and test configuration."
"uv.lock" = "Locked Python dependency graph."

[dotfiles]
".bumpversion.cfg" = "Version mirror configuration."
".codespellignore" = "Spelling dictionary entries."
".dockerignore" = "Container build context exclusions."
".env.example" = "Credential-free local environment configuration example."
".gitattributes" = "Git file attributes."
".gitignore" = "Repository exclusion patterns."
".mergequeue.yaml" = "Merge queue configuration."
".pre-commit-config.yaml" = "Blocking pre-commit and push checks."
".python-version" = "Python interpreter selection."
