# Tracked root entries of agent-terminal-ui, read by the shared root-hygiene hook
# (Knuckles-Team/pipelines). An allowlist, not a baseline: a new root entry needs
# a reason here or the gate fails, and an entry that is no longer tracked fails
# as stale. Every tool input that accepts a path override lives in .config/; the
# root keeps only what a tool discovers nowhere else.

[dirs]
".config" = "tool configuration: pre-commit suite (pre-commit -c), bump2version (--config-file), codespell ignore words, security-gate contract + harnesses, MkDocs theme overrides (custom_dir), this manifest"
".github" = "GitHub Actions workflows (GitHub discovers only .github/)"
agent_terminal_ui = "the Textual terminal frontend package"
docker = "the runtime image Dockerfile and its BuildKit-scoped Dockerfile.dockerignore (build: docker build -f docker/Dockerfile .)"
docs = "MkDocs sources for the public GitHub Pages site"
scripts = "gate and maintenance scripts run by pre-commit"
tests = "the pytest suite and Textual snapshot baselines"

[files]
"AGENTS.md" = "agent-facing repository guide (discovered at the root)"
"CHANGELOG.md" = "release changelog"
"CLAUDE.md" = "Claude Code instructions (discovered at the root)"
"README.md" = "project readme and PyPI long description (GitHub/PyPI render the root readme)"
"mkdocs.yml" = "Pages site configuration; mkdocs and the shared pages_pipeline read it only at the root"
"pyproject.toml" = "package metadata and tool configuration, including [tool.pytest.ini_options]"
"requirements.txt" = "runtime requirements the shared python_pipeline publish action installs from the root (pipelines publish-python-package: uv pip install -r requirements.txt)"
"uv.lock" = "uv lockfile (uv reads it only beside pyproject.toml)"

[dotfiles]
".gitattributes" = "git attributes (git reads only the root file)"
".gitignore" = "git exclusion patterns (git reads only the root file; carries the fleet-shared REQUIRED set)"
".mergequeue.yaml" = "merge-queue gate declaration; repository-manager's merge queue, lane doctor and validation policy read <repo>/.mergequeue.yaml only"
