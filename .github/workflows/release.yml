name: Release qualification

# Native cutover is qualification-only until the wheel matrix and runtime
# acceptance are reviewed. This workflow cannot upload to PyPI or tag a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-wheels:
    uses: ./.github/workflows/native-wheels.yml
