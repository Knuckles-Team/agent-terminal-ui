name: Release

# Manual dispatch keeps the native qualification lane available without a
# publication side effect. A v* tag runs that qualification first, then the
# publisher consumes the exact qualified native artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  PIPELINES_CONTRACT_SHA: e61e3f72fccc16d974d420503437ac0c6198b8db

jobs:
  native-wheels:
    uses: ./.github/workflows/native-wheels.yml

  publish-pypi:
    needs: [native-wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pipeline contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/pipelines
          ref: ${{ env.PIPELINES_CONTRACT_SHA }}
          sparse-checkout: |
            .github/actions/verify-release-version
            .github/actions/verify-release-source
          path: .pipeline-contract
          persist-credentials: false

      - name: Verify release version
        uses: ./.pipeline-contract/.github/actions/verify-release-version

      - name: Download x86_64 qualified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-wheel-x86_64
          path: native-artifacts/x86_64

      - name: Download aarch64 qualified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-wheel-aarch64
          path: native-artifacts/aarch64

      - name: Assemble and verify qualified publication artifacts
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          source_tree="$(git rev-parse HEAD^{tree})"
          export SOURCE_TREE="$source_tree"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          for arch in x86_64 aarch64; do
            mapfile -t wheels < <(find "native-artifacts/$arch" -type f -name '*.whl' -print)
            mapfile -t sdists < <(find "native-artifacts/$arch" -type f -name '*.tar.gz' -print)
            test "${#wheels[@]}" -eq 1
            test "${#sdists[@]}" -eq 1
            cp "${wheels[0]}" dist/
            if [[ "$arch" == x86_64 ]]; then
              cp "${sdists[0]}" dist/
            else
              cmp "${sdists[0]}" dist/"$(basename "${sdists[0]}")"
            fi
          done
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tomllib
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          root = Path("dist")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          wheels = sorted(root.glob("*.whl"))
          assert {p.name for p in wheels} == {
              f"tuig-{version}-py3-none-manylinux_2_28_x86_64.whl",
              f"tuig-{version}-py3-none-manylinux_2_28_aarch64.whl",
          }
          sdists = sorted(root.glob("*.tar.gz"))
          assert [p.name for p in sdists] == [f"tuig-{version}.tar.gz"]
          expected_source = os.environ["EXPECTED_SOURCE"]
          expected_tree = os.environ["SOURCE_TREE"]

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for arch in ("x86_64", "aarch64"):
              wheel = root / f"tuig-{version}-py3-none-manylinux_2_28_{arch}.whl"
              with zipfile.ZipFile(wheel) as archive:
                  metadata_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
                  metadata = Parser().parsestr(archive.read(metadata_name).decode())
                  assert metadata["Name"] == "tuig"
                  assert metadata["Version"] == version
                  scripts = [name for name in archive.namelist() if ".data/scripts/" in name]
                  assert scripts == [f"tuig-{version}.data/scripts/tuig"]
                  payload = archive.read(scripts[0])
                  assert payload[:4] == b"\x7fELF"
                  assert not any(name.endswith((".py", ".pyc", ".pyd")) for name in archive.namelist())
                  native_sha = hashlib.sha256(payload).hexdigest()
              provenance = sorted((Path("native-artifacts") / arch).rglob("provenance-*.json"))
              assert provenance
              for receipt_path in provenance:
                  receipt = json.loads(receipt_path.read_text())
                  assert receipt["source_revision"] == expected_source
                  assert receipt["source_tree"] == expected_tree
                  assert receipt["wheel"] == wheel.name
                  assert receipt["wheel_sha256"] == sha256(wheel)
                  assert receipt["native_sha256"] == native_sha
                  assert receipt["empty_path_help"] == "passed"
          print(f"verified {len(wheels)} native wheels and {sdists[0].name} from {expected_source}")
          PY

      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "BUILD_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            echo "LATEST_COMMIT=$GITHUB_SHA"
            echo "COMMIT_DATETIME=$(git show -s --format=%cI "$GITHUB_SHA")"
            echo "COMMIT_MESSAGE=$(git show -s --format=%s "$GITHUB_SHA")"
            echo "PIPELINES_CONTRACT_COMMIT=$PIPELINES_CONTRACT_SHA"
          } >> "$GITHUB_ENV"

      - name: Verify release source before publication
        uses: ./.pipeline-contract/.github/actions/verify-release-source
        env:
          READINESS_PYTHON: python3
          SOURCE_COMMIT: ${{ github.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish qualified artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ env.BUILD_VERSION }}
          body: |
            PyPI: [`tuig` ${{ env.BUILD_VERSION }}](https://pypi.org/project/tuig/${{ env.BUILD_VERSION }}/)

            ```bash
            pip install "tuig==${{ env.BUILD_VERSION }}"
            ```

            Released: ${{ env.COMMIT_DATETIME }}
            Commit: ${{ env.LATEST_COMMIT }}
            Pipelines contract: ${{ env.PIPELINES_CONTRACT_COMMIT }}
            Native qualification: `native-wheels` job

            Changes:
            ${{ env.COMMIT_MESSAGE }}
          files: dist/*
          draft: false
          prerelease: false
          make_latest: true
