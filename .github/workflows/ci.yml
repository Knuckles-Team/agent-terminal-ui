name: CI

# The fleet fast-PR standard (pipelines reference/ci-standard.md). A pull request
# runs the diff-scoped `gates` job (Python 3.14, affected tests) and, only when
# native sources change, `native-checks`. The caller aggregate `CI required` is
# the one required status check. Main and nightly add the full-tree gates, the
# full suite with the Python 3.12 backward smoke, and the native wheels.
# ste-advisory is report-only and not part of `CI required`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  ste-advisory:
    name: ste-advisory (report-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: STE-lite prose lint (advisory, report-only)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uvx --from pre-commit==4.6.2 pre-commit run ste-staged --config .pre-commit-config.yaml --hook-stage pre-commit --from-ref "$BASE_SHA" --to-ref HEAD

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.f.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'native/**'
              - 'tests/test_native*.py'
              - 'scripts/verify_native_wheel.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  gates:
    if: github.event_name == 'pull_request'
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      docs-only-paths: 'specs/* docs/* *.md plans/* LICENSE'
      config: .pre-commit-config.yaml
      python-version: '3.14'
      setup-command: |
        uv sync --python 3.14 --frozen --no-install-project --group test
      rust: true
      # sibling-checkout hooks are unavailable on a hosted runner; pytest is replaced by the shared affected-tests step
      # ste-staged (STE-lite prose lint) is advisory: the ste-advisory job runs it
      # report-only (operator gate cut).
      skip-hooks: okf-no-legacy-concepts,lane-guard,dependency-readiness,pytest,ste-staged
      timeout-minutes: 15

  main-gates:
    # Full-tree gates on main and nightly.
    if: github.event_name != 'pull_request'
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      config: .pre-commit-config.yaml
      python-version: '3.14'
      setup-command: |
        uv sync --python 3.14 --frozen --no-install-project --group test
      rust: true
      skip-hooks: okf-no-legacy-concepts,lane-guard,dependency-readiness,pytest,ste-staged
      all-files: true
      timeout-minutes: 60

  full:
    if: github.event_name != 'pull_request'
    uses: Knuckles-Team/pipelines/.github/workflows/main_pipeline.yml@main
    with:
      # tuig ships a native binary and no Python module; the 3.12 floor is
      # exercised by the Python-only contract tests, not an import.
      setup-command: |
        uv sync --frozen --no-install-project --group test
      backward-python: "3.12"
      backward-module: none
      backward-test-scope: tests/test_docs_layout.py tests/test_precommit_hooks.py tests/test_native_only_runtime.py
      rust: true
      rust-manifest-path: native/tuig/Cargo.toml

  native-wheels:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/native-wheels.yml

  native-checks:
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.native == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tuig
      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Native format
        run: cargo +1.96.0 fmt --manifest-path native/tuig/Cargo.toml --check
      - name: Native tests
        run: cargo +1.96.0 test --locked --manifest-path native/tuig/Cargo.toml
      - name: Native Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path native/tuig/Cargo.toml --all-targets -- -D warnings
      - name: Build the checkout's native terminal
        run: cargo +1.96.0 build --locked --manifest-path native/tuig/Cargo.toml --bin tuig
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
      - name: Required compiled-native PTY and headless journeys
        env:
          TUI_NATIVE_TEST_BINARY: ${{ github.workspace }}/native/tuig/target/debug/tuig
          PTY_RESULTS: ${{ runner.temp }}/native-pty-results.xml
        run: |
          set -euo pipefail
          uv sync --frozen --no-install-project --group test --python 3.14
          uv run --frozen --no-sync python -c 'import os, pathlib, pty, termios, pyte; binary = pathlib.Path(os.environ["TUI_NATIVE_TEST_BINARY"]); assert binary.is_file() and os.access(binary, os.X_OK)'
          uv run --frozen --no-sync pytest tests/test_native_local_session_pty.py tests/test_native_composer_pty.py tests/test_native_public_details_pty.py tests/test_native_spatial_graph_pty.py tests/test_native_headless.py tests/test_native_continuation.py -q -rP --no-cov --junitxml="$PTY_RESULTS"
          uv run --frozen --no-sync python -c 'import os, xml.etree.ElementTree as ET; cases = ET.parse(os.environ["PTY_RESULTS"]).findall(".//testcase"); assert len(cases) == 29 and all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "All twenty-nine required native cases must pass without skips"'

      - name: Required local ACP child lifecycle journeys
        env:
          TUI_NATIVE_TEST_BINARY: ${{ github.workspace }}/native/tuig/target/debug/tuig
          ACP_RESULTS: ${{ runner.temp }}/native-acp-results.xml
        run: |
          uv run --frozen --no-sync --with agent-client-protocol==0.11.0 python -m pytest tests/test_native_acp.py -q -rP --no-cov --junitxml="$ACP_RESULTS"
          uv run --frozen --no-sync python -c 'import os, xml.etree.ElementTree as ET; cases = ET.parse(os.environ["ACP_RESULTS"]).findall(".//testcase"); assert len(cases) == 13 and all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "All thirteen ACP lifecycle and helper-resolution cases must pass without skips"'

  ci-required:
    name: CI required
    if: always()
    needs: [gates, main-gates, full, native-wheels, native-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled job (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job ended $r"; exit 1;; esac
          done
