name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: &docs
      - specs/**
      - docs/**
      - '**/*.md'
      - plans/**
      - LICENSE
  push:
    branches: [main]
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}', github.workflow) }}
  cancel-in-progress: true

jobs:
  ste-advisory:
    name: ste-advisory (report-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: STE-lite prose lint (advisory, report-only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uvx --from pre-commit==4.6.2 pre-commit run ste-staged --config .pre-commit-config.yaml --hook-stage pre-commit --from-ref "$BASE_SHA" --to-ref HEAD

  gates:
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      config: .pre-commit-config.yaml
      setup-command: |
        uv sync --python 3.12 --frozen --extra test
        uv pip install --no-deps "arbora @ git+https://github.com/Knuckles-Team/arbora.git@5c32fc854c2275959ea4a00e2d16a082d8720fa6"
      rust: true
      # sibling-checkout hooks are unavailable on a hosted runner; pytest is replaced by the shared affected-tests step
      # ste-staged (STE-lite prose lint) is advisory: the ste-advisory job runs it
      # report-only (operator gate cut).
      skip-hooks: okf-no-legacy-concepts,lane-guard,dependency-readiness,pytest,ste-staged
      all-files: ${{ github.event_name == 'push' }}
      timeout-minutes: ${{ github.event_name == 'push' && 60 || 15 }}

  native-checks:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/agent-terminal-ui
      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Native format
        run: cargo +1.96.0 fmt --manifest-path native/agent-terminal-ui/Cargo.toml --check
      - name: Native tests
        run: cargo +1.96.0 test --locked --manifest-path native/agent-terminal-ui/Cargo.toml
      - name: Native Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path native/agent-terminal-ui/Cargo.toml --all-targets -- -D warnings
