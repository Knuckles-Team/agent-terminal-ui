name: Documentation screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - agent_terminal_ui/**
      - scripts/capture_screenshots.py
      - tests/test_documentation_screenshots.py
      - docs/assets/screenshots/**
      - uv.lock
      - .github/workflows/screenshots.yml

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Check committed screenshots
        run: uv run --frozen python -m scripts.capture_screenshots --check
      - name: Capture review artifacts
        if: always()
        run: uv run --frozen python -m scripts.capture_screenshots --output "$RUNNER_TEMP/tui-screenshots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: textual-documentation-screenshots
          path: ${{ runner.temp }}/tui-screenshots/*.svg
          if-no-files-found: error
