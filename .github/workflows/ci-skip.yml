name: CI skip

# Companion of ci.yml (paths-ignore): validates the blocking spec contract
# for documentation changes without running the native application build.

on:
  pull_request:
    paths:
      - specs/**
      - docs/**
      - '**/*.md'
      - plans/**
      - LICENSE

permissions:
  contents: read

concurrency:
  group: pr-gates-skip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates / gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
      - name: Validate the spec contract and commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uvx --from pre-commit==4.6.2 pre-commit run spec --config .pre-commit-config.yaml --hook-stage pre-commit --from-ref "$BASE_SHA" --to-ref HEAD
