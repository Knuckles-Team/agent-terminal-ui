INHERIT: .pipeline-theme/templates/mkdocs-theme/base.mkdocs.yml

site_name: "Tuig"
site_description: "Tuig: the Rust/Ratatui terminal frontend for Arbora."
site_url: "https://knuckles-team.github.io/agent-terminal-ui/"
repo_name: "Knuckles-Team/agent-terminal-ui"
repo_url: "https://github.com/Knuckles-Team/agent-terminal-ui"
edit_uri: "edit/main/docs/"
copyright: "Copyright &copy; Knuckles-Team — MIT licensed"

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  ecosystem:
    current: agent-terminal-ui
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Knuckles-Team/agent-terminal-ui
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tuig/

nav:
  - Home: index.md
  - Start: start.md
  - Status: status.md
  - Deployment: deployment.md
  - Design system: design-system.md
  - Screenshots: screenshots.md
  - Architecture: architecture.md
  - Development: development.md
  - Features: features.md
  - Configuration: configuration.md
  - Sessions & State:
      - Session Management: session_management.md
  - Agents & Workflows:
      - Agent View: agent_view.md
      - Goal Command: goal_command.md
      - Agents & Issues: agents.md
  - Reference:
      - Concepts: concepts.md
