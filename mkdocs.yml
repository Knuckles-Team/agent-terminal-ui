INHERIT: .pipeline-theme/templates/mkdocs-theme/base.mkdocs.yml

site_name: "Agent Terminal UI"
site_description: "Textual terminal frontend for agent sessions, Graph OS capabilities, run inspection, approvals, and session workflows."
site_url: "https://knuckles-team.github.io/agent-terminal-ui/"
repo_name: "Knuckles-Team/agent-terminal-ui"
repo_url: "https://github.com/Knuckles-Team/agent-terminal-ui"
edit_uri: "edit/main/docs/"
docs_dir: docs
strict: true
copyright: "Copyright &copy; Knuckles-Team — MIT licensed"

theme:
  logo: assets/brands/agent-terminal-ui-logo-v1.png
  favicon: assets/brands/agent-terminal-ui-logo-v1.png

extra:
  ecosystem:
    current: agent-terminal-ui
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Knuckles-Team/agent-terminal-ui
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agent-terminal-ui/

nav:
  - Home: index.md
  - Capabilities: capabilities.md
  - Interfaces: interfaces.md
  - Architecture: architecture.md
  - Status: status.md
  - Features: features.md
  - Configuration: configuration.md
  - Sessions & State:
      - Session Management: session_management.md
  - Agents & Workflows:
      - Agent View: agent_view.md
      - Goal Command: goal_command.md
      - Agents & Issues: agents.md
  - Reference:
      - Concepts: concepts.md
      - Knowledge graph extraction: kg-extraction.md
      - Ecosystem glossary: glossary.md
      - Skill graph reference: reference/skill-graph.generated.md
