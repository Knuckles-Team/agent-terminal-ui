site_name: "agent-terminal-ui"
site_description: "Textual-based terminal user interface for AI agents built on the agent-utilities platform — dual-protocol (AG-UI / ACP) chat, workflow visualization, session persistence, and autonomous goal loops."
site_url: "https://knuckles-team.github.io/agent-terminal-ui/"
repo_name: "Knuckles-Team/agent-terminal-ui"
repo_url: "https://github.com/Knuckles-Team/agent-terminal-ui"
edit_uri: "edit/main/docs/"
copyright: "Copyright &copy; Knuckles-Team — MIT licensed"

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/graph-outline
  favicon: https://raw.githubusercontent.com/squidfunk/mkdocs-material/master/material/templates/assets/images/favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Knuckles-Team/agent-terminal-ui
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agent-terminal-ui/

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Features: features.md
  - Configuration: configuration.md
  - Sessions & State:
      - Session Management: session_management.md
  - Agents & Workflows:
      - Agent View: agent_view.md
      - Goal Command: goal_command.md
      - Agents & Issues: agents.md
  - Reference:
      - Concepts: concepts.md
