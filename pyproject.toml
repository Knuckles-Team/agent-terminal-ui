[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-terminal-ui"
version = "2.3.2"
description = "Terminal UI for Agentic SI!"
readme = "README.md"
authors = [{ name = "Project maintainers" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "textual-diff-view>=0.1.5"
]

[project.optional-dependencies]
shell = [
    "bashlex>=0.18"
]
test = [
    "pyte==0.8.2",
    "pytest-xdist>=3.8.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.0",
    "pytest-cov>=7.1.0",
    "syrupy>=6.1.1",
    "pytest-benchmark>=5.2.3",
    "pytest-timeout>=2.4.0"
]
profile = [
    "memray>=1.19.3",
    "py-spy>=0.4.2",
    "psutil>=7.2.2"
]

[project.scripts]
agent-terminal-ui = "agent_terminal_ui.terminal_ui:terminal_ui"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_terminal_ui*"]

[tool.setuptools.package-data]
agent_terminal_ui = ["LICENSE", "py.typed", "skills/**/*", "screens/*.tcss", "tui/*.tcss"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pipelines_hooks.ste]
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "CHANGELOG.md", "docs", "specs"]
exempt = ["specs/_template/*"]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/agent-terminal-ui"
distribution = "agent-terminal-ui"
pages_url = "https://knuckles-team.github.io/agent-terminal-ui/"
mcp_server = false
