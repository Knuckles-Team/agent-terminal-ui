[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-terminal-ui"
version = "2.2.0"
description = "Terminal UI for Agentic AI!"
readme = "README.md"
authors = [{ name = "Project maintainers" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.11,<3.15"
dependencies = [
    "textual>=8.2.8",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "textual-diff-view>=0.1.5"
]

[project.optional-dependencies]
shell = [
    "bashlex>=0.18"
]
test = [
    "pytest-xdist>=3.8.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.0",
    "pytest-cov>=7.1.0",
    "syrupy>=5.5.3",
    "pytest-benchmark>=5.2.3",
    "pytest-timeout>=2.4.0"
]
profile = [
    "memray>=1.19.3",
    "py-spy>=0.4.2",
    "psutil>=7.2.2"
]

[project.scripts]
agent-terminal-ui = "agent_terminal_ui.terminal_ui:terminal_ui"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_terminal_ui*"]

[tool.setuptools.package-data]
agent_terminal_ui = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
