[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-terminal-ui"
version = "0.11.1"
description = "Terminal UI for Agentic AI!"
readme = "README.md"
authors = [{ name = "Audel Rouhi", email = "knucklessg1@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "textual>=8.2.0,<9.0.0",
    "rich>=15.0.0,<16.0.0",
    "agent-client-protocol>=0.9.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "textual-diff-view>=0.1.0"
]

[project.optional-dependencies]
shell = [
    "bashlex>=0.18"
]
test = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-env",
    "pytest-cov>=7.0.0,<8.0.0"
]

[project.scripts]
agent-terminal-ui = "agent_terminal_ui.terminal_ui:terminal_ui"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
agent_terminal_ui = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
