[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "tuig"
version = "2.3.6"
description = "Tuig: native Ratatui terminal interface for Arbora"
readme = "README.md"
authors = [{ name = "Repository Maintainers" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = [
    "pyyaml>=6.0.3",
    "pyte==0.8.2",
    "pytest-xdist>=3.8.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.0",
    "pytest-cov>=7.1.0",
    "syrupy>=6.1.1",
    "pytest-benchmark>=5.2.3",
    "pytest-timeout>=2.4.0",
]

[tool.maturin]
manifest-path = "native/tuig/Cargo.toml"
bindings = "bin"
locked = true
strip = true
include = [{ path = "LICENSE", format = "sdist" }]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pipelines_hooks.ste]
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "CHANGELOG.md", "docs", "specs"]
exempt = ["specs/_template/*"]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/tuig"
distribution = "tuig"
pages_url = "https://knuckles-team.github.io/tuig/"
mcp_server = false
